name: Run Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  php-tests:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: ['10', '11', '12', '13']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: 8.2
            laravel: '13'
          - php: 8.5
            laravel: '10'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Set framework constraints
        shell: bash
        run: |
          case "${{ matrix.laravel }}" in
            10) testbench='^8.0' ;;
            11) testbench='^9.2' ;;
            12) testbench='^10.0' ;;
            13) testbench='^11.0' ;;
          esac
          composer require \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/view:^${{ matrix.laravel }}.0" \
            --no-interaction --no-update
          composer require "orchestra/testbench:${testbench}" --dev --no-interaction --no-update

      - name: Install dependencies
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Verify resolved framework
        shell: bash
        run: |
          composer show laravel/framework
          composer show orchestra/testbench
          php -r 'require "vendor/autoload.php"; exit(Composer\InstalledVersions::satisfies(new Composer\Semver\VersionParser, "laravel/framework", "^${{ matrix.laravel }}.0") ? 0 : 1);'

      - name: Install Blaze when compatible
        run: composer require "livewire/blaze:^1.0.2" --dev --no-interaction
        continue-on-error: true

      - name: Execute tests
        run: ./vendor/bin/pest --ci --parallel

  release-gates:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    name: Static analysis and release archive

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Rector
        run: ./vendor/bin/rector process --dry-run --no-progress-bar

      - name: Check whitespace errors
        run: git diff --check

      - name: Build and inspect archive
        shell: bash
        run: |
          archive_dir="$RUNNER_TEMP/forte-archive"
          mkdir -p "$archive_dir"
          composer archive --format=zip --dir="$archive_dir"
          archive="$(find "$archive_dir" -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$archive"
          test "$(stat -c '%s' "$archive")" -lt 2097152
          if unzip -Z1 "$archive" | grep -Eq '(^|/)(vendor|tests|\.github|\.idea|\.claude|\.phpstan\.cache|\.phpunit\.cache)(/|$)|(^|/)composer\.lock$'; then
            echo 'Release archive contains development-only files.' >&2
            exit 1
          fi
